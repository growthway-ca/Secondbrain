<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Commonplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A local-first second brain: capture, journal, link and rediscover your notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: a quiet rail on the left, one working surface on the right. Connections are drawn as "synapses":
   two hematoxylin/eosin stain colours borrowed from brain histology, used only where notes meet. */
:root{
  color-scheme:light;
  --bg:#F2F1F6; --surface:#FFFFFF; --sunk:#E9E7F0; --line:#DDDAE7;
  --ink:#191628; --ink2:#5D5873; --ink3:#8E89A3;
  --hema:#4636B8; --hema-soft:#E7E4FB; --eosin:#D93C74; --eosin-soft:#FBE3EC;
  --ok:#1E8A5A; --danger:#B4303B;
  --c-written:#4636B8; --c-keep:#C98208; --c-chat:#2B78D0; --c-file:#11907E; --c-daily:#D93C74;
  --shadow:0 1px 2px rgba(25,22,40,.06),0 8px 24px -12px rgba(25,22,40,.18);
  --shadow-lg:0 24px 64px -16px rgba(25,22,40,.35),0 2px 6px rgba(25,22,40,.08);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --read:"Newsreader",Charter,"Iowan Old Style",Georgia,serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:15.5rem; --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F0D18; --surface:#181524; --sunk:#211D30; --line:#2C2742;
    --ink:#EEEBF7; --ink2:#A8A2BF; --ink3:#6F6987;
    --hema:#A397FF; --hema-soft:#26214A; --eosin:#FF6F9F; --eosin-soft:#3A1A2B;
    --ok:#4FD39A; --danger:#FF7A84;
    --c-written:#A397FF; --c-keep:#F2B13E; --c-chat:#6FB2FF; --c-file:#3CCDB6; --c-daily:#FF6F9F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lg:0 28px 70px -18px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F0D18; --surface:#181524; --sunk:#211D30; --line:#2C2742;
  --ink:#EEEBF7; --ink2:#A8A2BF; --ink3:#6F6987;
  --hema:#A397FF; --hema-soft:#26214A; --eosin:#FF6F9F; --eosin-soft:#3A1A2B;
  --ok:#4FD39A; --danger:#FF7A84;
  --c-written:#A397FF; --c-keep:#F2B13E; --c-chat:#6FB2FF; --c-file:#3CCDB6; --c-daily:#FF6F9F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lg:0 28px 70px -18px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--display);font-optical-sizing:auto;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--hema);outline-offset:2px;border-radius:6px}
.hide{display:none!important}
::selection{background:var(--hema-soft)}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
kbd{font:500 .72rem/1 var(--mono);padding:.22rem .38rem;border-radius:5px;background:var(--sunk);border:1px solid var(--line);color:var(--ink2)}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.faint{color:var(--ink3)}
.eyebrow{font:500 .7rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.ic{margin-right:.35rem}
svg.i{width:1.05em;height:1.05em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:1.25rem;padding:1.15rem .8rem 1rem 1rem;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;padding:.2rem .4rem}
.brand svg{width:1.7rem;height:1.7rem}
.brand b{font:700 1.18rem/1 var(--display);letter-spacing:-.025em;font-variation-settings:"wdth" 90}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:.65rem;padding:.48rem .6rem;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:500;position:relative}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav a.on::after{content:"";position:absolute;right:.7rem;width:6px;height:6px;border-radius:50%;background:var(--eosin)}
.nav a .n{margin-left:auto;font:400 .72rem var(--mono);color:var(--ink3)}
.nav a.on .n{margin-right:.9rem}
.rail h4{margin:0 0 .35rem .6rem;font:500 .66rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.rail .list{display:flex;flex-direction:column;gap:1px}
.rail .list a{display:flex;align-items:center;gap:.5rem;padding:.32rem .6rem;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:.88rem;min-width:0}
.rail .list a:hover{background:var(--sunk);color:var(--ink)}
.rail .list a span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rail .list a .c{font:.7rem var(--mono);color:var(--ink3)}
.rail .tags{display:flex;flex-wrap:wrap;gap:.3rem;padding:0 .4rem}
.rail .tags a{font:.76rem var(--mono);padding:.18rem .45rem;border-radius:6px;background:var(--sunk);color:var(--ink2);text-decoration:none}
.rail .tags a:hover{color:var(--hema)}
.rail .grow{flex:1}
.rail .foot{display:flex;flex-direction:column;gap:.55rem;padding:0 .4rem}
.rail .foot .row-btns{flex-wrap:nowrap;gap:.15rem}
.rail .foot .ib{width:1.95rem;height:1.95rem}
.status{font:.72rem/1.4 var(--mono);color:var(--ink3);min-height:1em}
.status .bar{display:block;height:3px;border-radius:2px;background:var(--sunk);margin-top:.35rem;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--hema);transition:width .2s}

.work{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:.6rem;padding:.75rem max(16px,env(safe-area-inset-right,0px)) .75rem clamp(1rem,3vw,2.2rem);background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar .m-brand{display:none}
.search-trigger{flex:1;max-width:34rem;display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink3);cursor:pointer;text-align:left}
.search-trigger:hover{border-color:var(--ink3)}
.search-trigger span{flex:1}
.topbar .sp{flex:1}
.main{flex:1;min-width:0;padding:1rem clamp(1rem,3vw,2.2rem) 5rem;padding-right:max(16px,env(safe-area-inset-right,0px),clamp(1rem,3vw,2.2rem))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid transparent;background:var(--ink);color:var(--bg);padding:.52rem .95rem;border-radius:10px;font-weight:600;font-size:.9rem;text-decoration:none;cursor:pointer;line-height:1.15;white-space:nowrap;transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.accent{background:var(--hema);color:#fff}
:root[data-theme="dark"] .btn.accent{color:#120F22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.accent{color:#120F22}}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:.36rem .7rem;font-size:.82rem;border-radius:8px}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2.15rem;height:2.15rem;border-radius:9px;border:0;background:transparent;color:var(--ink2);cursor:pointer;flex:none}
.ib:hover{background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--eosin)}
.lk{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:.22em;text-decoration-thickness:1.5px;font-size:inherit}
.lk:hover{color:var(--ink);text-decoration-color:var(--hema)}
.lk.danger{color:var(--danger)}
.row-btns{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:.3rem;font:500 .72rem/1 var(--mono);padding:.3rem .5rem;border-radius:6px;background:var(--sunk);color:var(--ink2);text-decoration:none;white-space:nowrap}
a.chip:hover{color:var(--hema)}
.tag{font:500 .78rem var(--mono);color:var(--hema);text-decoration:none}
.tag:hover{text-decoration:underline}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--c-written);flex:none}
.dot[data-src="keep"]{background:var(--c-keep);border-radius:2px}
.dot[data-src="chat"]{background:var(--c-chat)}
.dot[data-src="file"]{background:var(--c-file);border-radius:1px;transform:rotate(45deg) scale(.86)}
.dot[data-src="daily"]{background:var(--c-daily)}

/* stage: dot size encodes maturity */
.stage{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);gap:2px}
.stage button{display:inline-flex;align-items:center;gap:.4rem;border:0;background:transparent;padding:.28rem .55rem;border-radius:7px;font-size:.78rem;font-weight:500;color:var(--ink2);cursor:pointer}
.stage button i{display:inline-block;border-radius:50%;background:currentColor}
.stage button[data-v="capture"] i{width:5px;height:5px}
.stage button[data-v="developing"] i{width:7px;height:7px}
.stage button[data-v="evergreen"] i{width:9px;height:9px}
.stage button.on{background:var(--surface);color:var(--ok);box-shadow:var(--shadow)}
.sg{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;color:var(--ink3)}
.sg i{display:inline-block;border-radius:50%;background:var(--ok)}

/* ---------- headings & sections ---------- */
.hero-h{font:700 clamp(2rem,4.6vw,3.3rem)/1.02 var(--display);letter-spacing:-.035em;font-variation-settings:"wdth" 88}
.hero-h em{font-style:normal;color:var(--ink3)}
.page-h{font:700 clamp(1.6rem,3vw,2.2rem)/1.08 var(--display);letter-spacing:-.03em}
.sub{margin-top:.5rem;color:var(--ink2)}
.sec{margin-top:2.4rem}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.85rem}
.sec-h h2{font:650 1.05rem/1.2 var(--display);letter-spacing:-.01em}
.sec-h .eyebrow{margin-right:auto;margin-left:.6rem}

/* ---------- today ---------- */
.today{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:2.6rem;align-items:start;max-width:76rem}
.today .side{display:flex;flex-direction:column;gap:2rem;position:sticky;top:4.5rem}
.capture{margin-top:1.6rem;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem 1rem .7rem;box-shadow:var(--shadow);transition:border-color .15s}
.capture:focus-within{border-color:var(--hema)}
.capture textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font:1.18rem/1.45 var(--read);min-height:2rem;max-height:14rem}
.capture textarea::placeholder{color:var(--ink3)}
.capture .bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.35rem}
.capture .bar .hint{margin-right:auto;font:.72rem var(--mono);color:var(--ink3)}

.synapse{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(6rem,9rem) minmax(0,1fr);align-items:center;gap:0}
.synapse svg.thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.synapse .thread path.base{stroke:var(--eosin);stroke-width:2;fill:none;opacity:.35}
.synapse .thread path.flow{stroke:var(--eosin);stroke-width:2.4;fill:none;stroke-dasharray:6 14;animation:flow 1.6s linear infinite}
.synapse .thread circle{fill:var(--eosin)}
@keyframes flow{to{stroke-dashoffset:-40}}
.syn-card{position:relative;z-index:1;padding:1.05rem 1.1rem 1.1rem;text-decoration:none;display:flex;flex-direction:column;gap:.45rem;transition:transform .18s,box-shadow .18s;min-width:0}
.syn-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.syn-card h3{font:650 1.08rem/1.25 var(--display);letter-spacing:-.01em}
.syn-card p{margin:0;font:.95rem/1.55 var(--read);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.syn-card .mono{color:var(--ink3);display:flex;align-items:center;gap:.4rem}
.syn-mid{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;padding:.6rem 0}
.syn-mid .w{font:500 .74rem/1 var(--mono);padding:.32rem .5rem;border-radius:999px;background:var(--surface);border:1.5px solid var(--eosin);color:var(--eosin);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.syn-mid .w.tg{background:var(--eosin);color:var(--surface)}
.syn-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;margin-top:1rem}
.syn-foot .why{color:var(--ink2);font-size:.9rem;flex-basis:100%}
mark.hl{background:var(--eosin-soft);color:inherit;border-radius:3px;padding:0 .12em;box-shadow:inset 0 -2px 0 var(--eosin);box-decoration-break:clone;-webkit-box-decoration-break:clone}

.resurface{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.8rem}
.rs{padding:1rem;text-decoration:none;display:flex;flex-direction:column;gap:.45rem;transition:transform .18s,box-shadow .18s}
.rs:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rs h3{font:650 1rem/1.25 var(--display)}
.rs p{margin:0;font:.9rem/1.5 var(--read);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rs .age{font:.7rem var(--mono);color:var(--eosin)}

.mini{display:flex;flex-direction:column}
.mini a,.mini .it{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line);text-decoration:none;min-width:0;font-size:.92rem}
.mini a:last-child,.mini .it:last-child{border-bottom:1px solid var(--line)}
.mini a .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini a:hover .t{color:var(--hema)}
.mini .m{font:.7rem var(--mono);color:var(--ink3);white-space:nowrap}

.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(20,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px;width:100%;max-width:22rem}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.heat i[data-l="1"]{background:color-mix(in oklab,var(--hema) 28%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in oklab,var(--hema) 52%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in oklab,var(--hema) 76%,var(--sunk))}
.heat i[data-l="4"]{background:var(--hema)}
.heat i.today{outline:1.5px solid var(--eosin);outline-offset:1px}
.heat-legend{display:flex;justify-content:space-between;margin-top:.45rem;font:.68rem var(--mono);color:var(--ink3)}

/* ---------- tasks ---------- */
.task{display:flex;gap:.65rem;align-items:flex-start;padding:.5rem 0;font-size:.95rem}
.cb{flex:none;width:1.05rem;height:1.05rem;margin-top:.18rem;border-radius:5px;border:1.6px solid var(--ink3);background:transparent;cursor:pointer;display:inline-grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--hema)}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"";width:.32rem;height:.58rem;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.task.done .tx{color:var(--ink3);text-decoration:line-through}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task .from{display:block;font:.7rem var(--mono);color:var(--ink3);text-decoration:none;margin-top:.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .from:hover{color:var(--hema)}
.tgroup{padding:1rem 1.1rem;margin-bottom:.8rem}
.tgroup h3{font:650 .98rem/1.3 var(--display);display:flex;align-items:center;gap:.5rem}
.tgroup h3 a{text-decoration:none}
.tgroup h3 a:hover{color:var(--hema)}

/* ---------- notes list / grid / board ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin:1.2rem 0 1rem}
.field{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;flex:1;min-width:min(100%,16rem);max-width:30rem;color:var(--ink3)}
.field:focus-within{border-color:var(--hema)}
.field input{flex:1;border:0;background:transparent;outline:none;min-width:0;color:var(--ink)}
.seg{display:inline-flex;padding:2px;border-radius:10px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.36rem .65rem;border-radius:8px;font-size:.82rem;font-weight:500;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.35rem}
.seg button .n{font:.68rem var(--mono);color:var(--ink3)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.48rem .6rem;font-size:.84rem;color:var(--ink);max-width:13rem}
.count{font:.74rem var(--mono);color:var(--ink3);margin:.2rem 0 .6rem}

.rows{list-style:none;margin:0;padding:0;max-width:56rem}
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:1rem minmax(0,1fr) auto;gap:.15rem .7rem;align-items:baseline;padding:.75rem .5rem;text-decoration:none;border-radius:8px;margin:0 -.5rem}
.row:hover{background:var(--surface)}
.row .dot{align-self:center}
.row .t{font:600 1rem/1.3 var(--display);overflow-wrap:anywhere}
.row .t .ic{margin-right:.35rem}
.row .s{grid-column:2/4;font:.92rem/1.5 var(--read);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{display:flex;gap:.6rem;align-items:center;font:.7rem var(--mono);color:var(--ink3);white-space:nowrap}
.row .m .links{color:var(--eosin)}

.grid{columns:15rem;column-gap:.8rem}
.gcard{break-inside:avoid;margin-bottom:.8rem;display:block;padding:.95rem 1rem;text-decoration:none;transition:transform .18s,box-shadow .18s}
.gcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.gcard h3{font:650 .98rem/1.3 var(--display);margin-bottom:.35rem;overflow-wrap:anywhere}
.gcard .b{font:.9rem/1.5 var(--read);color:var(--ink2);overflow-wrap:anywhere;max-height:13rem;overflow:hidden;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.gcard .b ul{padding-left:1.1rem;margin:.2rem 0}
.gcard .b p{margin:0 0 .4rem}
.gcard .f{display:flex;gap:.5rem;align-items:center;margin-top:.6rem;font:.68rem var(--mono);color:var(--ink3)}
.gcard .f .dot{width:.45rem;height:.45rem}

.board{display:grid;grid-template-columns:repeat(3,minmax(16rem,1fr));gap:1rem;align-items:start;overflow-x:auto;padding-bottom:1rem}
.col{background:var(--sunk);border-radius:14px;padding:.7rem;min-height:12rem;transition:background .15s,outline-color .15s;outline:2px dashed transparent;outline-offset:-2px}
.col.over{outline-color:var(--hema);background:var(--hema-soft)}
.col-h{display:flex;align-items:center;gap:.5rem;padding:.25rem .3rem .7rem}
.col-h h3{font:650 .92rem var(--display)}
.col-h p{margin:0 0 0 auto;font:.7rem var(--mono);color:var(--ink3)}
.col-h i{display:inline-block;border-radius:50%;background:var(--ok)}
.col .desc{font-size:.78rem;color:var(--ink3);margin:-.4rem .3rem .7rem}
.bcard{display:block;padding:.75rem .8rem;margin-bottom:.5rem;text-decoration:none;cursor:grab;position:relative}
.bcard:active{cursor:grabbing}
.bcard.dragging{opacity:.4}
.bcard h4{margin:0 0 .25rem;font:600 .9rem/1.3 var(--display);overflow-wrap:anywhere;padding-right:2.6rem}
.bcard p{margin:0;font:.82rem/1.45 var(--read);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcard .mv{position:absolute;top:.45rem;right:.4rem;display:flex;gap:1px;opacity:0;transition:opacity .15s}
.bcard:hover .mv,.bcard:focus-within .mv{opacity:1}
.bcard .mv button{width:1.4rem;height:1.4rem;border:0;border-radius:5px;background:var(--sunk);color:var(--ink2);cursor:pointer;font-size:.75rem;line-height:1}
.bcard .mv button:hover{color:var(--hema)}
.col .more{font:.72rem var(--mono);color:var(--ink3);padding:.3rem}

/* ---------- note ---------- */
.note{display:grid;grid-template-columns:minmax(0,44rem) minmax(16rem,20rem);gap:3rem;align-items:start;max-width:72rem}
.crumbs{display:flex;align-items:center;gap:.4rem;font:.74rem var(--mono);color:var(--ink3);margin-bottom:1.6rem;flex-wrap:wrap}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--hema)}
.crumbs{flex-wrap:nowrap}
.crumbs .ct-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved{font:.7rem var(--mono);color:var(--ink3);transition:opacity .4s}
.icon-slot{border:0;background:transparent;font-size:2.4rem;line-height:1;padding:.1rem;margin:0 0 .5rem -.15rem;cursor:pointer;border-radius:10px;min-width:3rem;min-height:3rem}
.icon-slot.empty{font-size:.78rem;color:var(--ink3);min-height:0;min-width:0;padding:.25rem .45rem;margin-bottom:.4rem;opacity:0;font-family:var(--mono)}
.doc:hover .icon-slot.empty,.icon-slot.empty:focus-visible{opacity:1}
.icon-slot:hover{background:var(--sunk)}
.title-in{display:block;width:100%;background:transparent;border:0;outline:none;font:700 clamp(1.8rem,3.6vw,2.6rem)/1.08 var(--display);letter-spacing:-.03em;padding:0;resize:none;overflow:hidden;color:var(--ink)}
.title-in::placeholder{color:var(--ink3)}
.props{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center;margin:1rem 0 .7rem;font-size:.82rem;color:var(--ink2)}
.props .mono{color:var(--ink3)}
.tagrow{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin-bottom:1.6rem}
.tagrow .tg{display:inline-flex;align-items:center;gap:.15rem;font:500 .75rem var(--mono);padding:.25rem .3rem .25rem .5rem;border-radius:6px;background:var(--hema-soft);color:var(--hema)}
.tagrow .tg a{text-decoration:none}
.tagrow .tg.inl{padding-right:.5rem}
.tagrow .tg button{border:0;background:none;color:inherit;cursor:pointer;padding:0 .15rem;opacity:.6}
.tagrow .tg button:hover{opacity:1}
.tagrow input{border:0;background:transparent;outline:none;font:.75rem var(--mono);width:7rem;padding:.25rem .2rem;color:var(--ink)}
.tagrow input::placeholder{color:var(--ink3)}

.reader{font:1.14rem/1.72 var(--read);overflow-wrap:anywhere;cursor:text;min-height:8rem}
.reader>*:first-child{margin-top:0}
.reader p{margin:0 0 1em}
.reader h1,.reader h2,.reader h3,.reader h4,.reader h5,.reader h6{font-family:var(--display);letter-spacing:-.015em;margin:1.6em 0 .5em;line-height:1.25}
.reader h1{font-size:1.55rem}.reader h2{font-size:1.3rem}.reader h3{font-size:1.12rem}.reader h4,.reader h5,.reader h6{font-size:1rem}
.reader ul,.reader ol{padding-left:1.4rem;margin:0 0 1em}
.reader li{margin:.25em 0}
.reader li.chk{list-style:none;margin-left:-1.4rem;display:flex;gap:.65rem;align-items:flex-start}
.reader li.chk .cb{margin-top:.38rem}
.reader li.chk.done>span:last-child{color:var(--ink3);text-decoration:line-through}
.reader blockquote{margin:0 0 1em;padding:.1rem 0 .1rem 1.1rem;border-left:3px solid var(--eosin);color:var(--ink2);font-style:italic}
.reader code{font:.84em var(--mono);background:var(--sunk);padding:.12em .35em;border-radius:5px}
.reader pre{background:var(--sunk);padding:1rem 1.1rem;border-radius:10px;overflow:auto;margin:0 0 1em;line-height:1.5}
.reader pre code{background:none;padding:0}
.reader hr{border:0;height:1px;background:var(--line);margin:2em 0}
.reader a{color:var(--hema);text-decoration-thickness:1px;text-underline-offset:.2em}
.reader a.wl{text-decoration:none;background:var(--hema-soft);border-radius:4px;padding:0 .1em;font-weight:500}
.reader a.wl:hover{background:var(--hema);color:var(--surface)}
.reader a.wl.missing{background:none;color:var(--ink2);text-decoration:underline dashed;text-decoration-color:var(--ink3)}
.reader a.tg{font:500 .82em var(--mono);text-decoration:none}
.reader .empty{color:var(--ink3);font-style:italic}
.editor{display:block;width:100%;min-height:20rem;background:transparent;border:0;outline:none;padding:0;font:1.08rem/1.72 var(--read);resize:none;color:var(--ink);overflow:hidden;tab-size:2}
.editor::placeholder{color:var(--ink3)}
.edit-wrap{position:relative}
.edit-hint{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin-top:1.4rem;padding-top:.8rem;border-top:1px dashed var(--line);font:.72rem var(--mono);color:var(--ink3)}
.doc-foot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-top:2rem}

.side-panel{position:sticky;top:4.6rem;display:flex;flex-direction:column;gap:1.6rem;max-height:calc(100dvh - 5.5rem);overflow-y:auto;scrollbar-width:thin;padding-right:.2rem}
.side-panel h2{font:500 .68rem/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:.6rem;display:flex;gap:.5rem;align-items:center}
.side-panel h2 .n{color:var(--eosin)}
.lgraph{height:13rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.lgraph canvas{display:block;width:100%;height:100%;cursor:pointer}
.conn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.conn li{padding:.65rem .75rem;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.conn .ct{font:600 .9rem/1.3 var(--display);text-decoration:none;display:flex;gap:.45rem;align-items:center}
.conn .ct:hover{color:var(--hema)}
.conn .why{display:block;font-size:.78rem;color:var(--ink2);margin-top:.25rem}
.conn .ctx{display:block;font:.85rem/1.45 var(--read);color:var(--ink2);margin-top:.3rem}
.conn .acts{display:flex;gap:.8rem;margin-top:.4rem;font-size:.76rem}
.conn .meter{display:inline-block;width:2.4rem;height:4px;border-radius:2px;background:var(--sunk);margin-left:auto;flex:none;overflow:hidden}
.conn .meter i{display:block;height:100%;background:var(--eosin)}
.outline{list-style:none;margin:0;padding:0;border-left:1.5px solid var(--line)}
.outline a{display:block;padding:.2rem .75rem;font-size:.84rem;color:var(--ink2);text-decoration:none;margin-left:-1.5px;border-left:1.5px solid transparent}
.outline a:hover{color:var(--ink);border-left-color:var(--hema)}
.outline a[data-l="2"]{padding-left:1.4rem}.outline a[data-l="3"]{padding-left:2.05rem}

/* focus mode */
body.focus .rail,body.focus .topbar,body.focus .side-panel,body.focus .dock,body.focus .crumbs .hide-focus{display:none!important}
body.focus .app{grid-template-columns:minmax(0,1fr)}
body.focus .note{grid-template-columns:minmax(0,42rem);justify-content:center;max-width:none;padding-top:8vh}
.focus-exit{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));right:calc(1rem + env(safe-area-inset-right,0px));z-index:40}

/* ---------- journal ---------- */
.journal{display:grid;grid-template-columns:minmax(0,44rem) 18rem;gap:3rem;align-items:start;max-width:72rem}
.jday{margin-bottom:2.6rem}
.jday-h{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.jday-h a{text-decoration:none}
.jday-h h2{font:700 1.5rem/1.1 var(--display);letter-spacing:-.025em}
.jday-h .mono{color:var(--ink3)}
.jday.cur .jday-h h2{font-size:clamp(1.9rem,3.8vw,2.7rem);letter-spacing:-.035em;font-variation-settings:"wdth" 88}
.jday .paper{padding:1.3rem 1.4rem;min-height:6rem}
.jday.past .paper{background:transparent;border-style:dashed}
.cal{padding:1rem}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.cal-h b{font:650 .95rem var(--display)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-g .dw{font:.62rem var(--mono);color:var(--ink3);padding:.2rem 0}
.cal-g button{position:relative;height:2.1rem;width:100%;border:0;background:transparent;border-radius:8px;font:.78rem var(--mono);color:var(--ink2);cursor:pointer;padding:0}
.cal-g button:hover{background:var(--sunk);color:var(--ink)}
.cal-g button.out{color:var(--ink3);opacity:.45}
.cal-g button.act{background:color-mix(in oklab,var(--hema) 14%,transparent)}
.cal-g button.has::after{content:"";position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--eosin)}
.cal-g button.today{outline:1.5px solid var(--eosin);outline-offset:-1.5px;color:var(--ink);font-weight:500}
.cal-g button.sel{background:var(--ink);color:var(--bg)}

/* ---------- graph ---------- */
.gwrap{position:relative;height:calc(100dvh - 9.5rem);min-height:26rem;border-radius:18px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,var(--surface),var(--sunk));border:1px solid var(--line)}
.gwrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.gctl{position:absolute;top:.8rem;left:.8rem;right:.8rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;pointer-events:none}
.gctl>*{pointer-events:auto}
.gctl .field{flex:0 1 16rem;min-width:12rem;box-shadow:var(--shadow)}
.gtog{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .65rem;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:.8rem;cursor:pointer;box-shadow:var(--shadow);color:var(--ink2)}
.gtog input{accent-color:var(--hema);margin:0}
.glegend{position:absolute;left:.9rem;bottom:.8rem;display:flex;flex-wrap:wrap;gap:.3rem .9rem;font:.68rem var(--mono);color:var(--ink3);pointer-events:none}
.glegend span{display:inline-flex;align-items:center;gap:.35rem}
.glegend b{display:inline-block;width:1.2rem;height:0;border-top:2px solid var(--hema)}
.glegend b.d{border-top:2px dashed var(--eosin)}
.gpanel{position:absolute;right:.8rem;bottom:.8rem;width:min(21rem,calc(100% - 1.6rem));max-height:calc(100% - 5rem);overflow:auto;padding:1rem;box-shadow:var(--shadow-lg)}
.gpanel h3{font:650 1.05rem/1.25 var(--display);margin:.2rem 0}
.gpanel .conn li{background:var(--bg)}
.ghint{position:absolute;right:.9rem;bottom:.8rem;font:.7rem var(--mono);color:var(--ink3);pointer-events:none;text-align:right}

/* ---------- popovers / palette / dialogs ---------- */
.pop{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:.35rem;min-width:15rem;max-width:min(22rem,calc(100vw - 2rem));max-height:18rem;overflow:auto}
.pop button{display:flex;width:100%;align-items:center;gap:.6rem;border:0;background:transparent;padding:.45rem .55rem;border-radius:8px;text-align:left;cursor:pointer;font-size:.88rem;color:var(--ink)}
.pop button .k{margin-left:auto;font:.68rem var(--mono);color:var(--ink3)}
.pop button.on{background:var(--hema-soft);color:var(--hema)}
.pop .ph{font:500 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:.45rem .55rem .25rem}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emoji-grid button{justify-content:center;font-size:1.2rem;padding:.35rem 0}
.preview{position:fixed;z-index:65;width:min(24rem,calc(100vw - 2rem));max-height:20rem;overflow:hidden;padding:1rem 1.1rem;box-shadow:var(--shadow-lg);pointer-events:none;animation:pop .14s ease-out}
.preview h4{margin:0 0 .4rem;font:650 1rem var(--display)}
.preview .reader{font-size:.92rem;line-height:1.55;-webkit-mask-image:linear-gradient(#000 70%,transparent);max-height:14rem;overflow:hidden;min-height:0}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}}

dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:calc(100vw - 2rem);max-height:calc(100dvh - 2rem)}
dialog::backdrop{background:color-mix(in oklab,#0B0914 50%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
dialog[open]>.sheet{animation:pop .16s ease-out}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);width:min(36rem,calc(100vw - 2rem));max-height:calc(100dvh - 2rem);overflow:auto;padding:1.5rem}
.sheet h2{font:650 1.2rem/1.2 var(--display);letter-spacing:-.015em;margin-bottom:.4rem}
.sheet h3{font:650 .95rem var(--display);margin:1.5rem 0 .4rem}
.sheet p{margin:.3rem 0 .9rem;color:var(--ink2);font-size:.92rem}
.sheet details{margin:.6rem 0;color:var(--ink2);font-size:.88rem}
.sheet summary{cursor:pointer;color:var(--ink);font-weight:500}
.sheet .x{float:right;margin:-.5rem -.5rem 0 0}
.drop{display:flex;flex-direction:column;align-items:center;gap:.7rem;padding:1.6rem 1rem;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--hema);background:var(--hema-soft)}
.drop svg{width:2rem;height:2rem;color:var(--hema)}

#palette .sheet{width:min(40rem,calc(100vw - 2rem));padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:min(34rem,calc(100dvh - 4rem))}
dialog#palette{margin-top:12vh}
.pal-in{display:flex;align-items:center;gap:.7rem;padding:1rem 1.15rem;border-bottom:1px solid var(--line);color:var(--ink3)}
.pal-in input{flex:1;border:0;outline:none;background:transparent;font:500 1.1rem var(--display);color:var(--ink);min-width:0}
.pal-res{overflow:auto;padding:.4rem;flex:1}
.pal-res .ph{font:500 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding:.6rem .7rem .3rem}
.pal-it{display:flex;align-items:center;gap:.7rem;width:100%;padding:.55rem .7rem;border:0;background:transparent;border-radius:10px;text-align:left;cursor:pointer;color:var(--ink);min-width:0}
.pal-it .tx{flex:1;min-width:0}
.pal-it .tx b{display:block;font-weight:600;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it .tx small{display:block;font:.82rem/1.4 var(--read);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it .k{font:.68rem var(--mono);color:var(--ink3);white-space:nowrap}
.pal-it svg.i{color:var(--ink3)}
.pal-it.on{background:var(--hema-soft)}
.pal-it.on svg.i,.pal-it.on .k{color:var(--hema)}
.pal-it.ask{color:var(--eosin)}
.pal-it.ask svg.i{color:var(--eosin)}
.pal-foot{display:flex;gap:1rem;padding:.6rem 1rem;border-top:1px solid var(--line);font:.68rem var(--mono);color:var(--ink3);flex-wrap:wrap}

.ask-q{display:flex;gap:.5rem;align-items:center;margin:.8rem 0 1rem}
.ask-q .field{max-width:none}
.answer{font:1.02rem/1.65 var(--read);min-height:2rem}
.answer .reader{font-size:1.02rem;cursor:auto;min-height:0}
.thinking{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink3);font:.8rem var(--mono)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--eosin);animation:blink 1s infinite alternate}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{from{opacity:.2}to{opacity:1}}
.srcs{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:1rem}

.keys{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.2rem;align-items:center;font-size:.9rem}
.keys span:nth-child(odd){display:flex;gap:.25rem;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:1rem;background:var(--ink);color:var(--bg);padding:.65rem .8rem .65rem 1.1rem;border-radius:12px;font-weight:500;font-size:.9rem;max-width:calc(100vw - 2rem);box-shadow:var(--shadow-lg);animation:pop .16s ease-out}
.toast button{border:0;background:color-mix(in oklab,var(--bg) 18%,transparent);color:var(--bg);font-weight:600;padding:.3rem .6rem;border-radius:7px;cursor:pointer}
.toast:not(:has(button)){padding-right:1.1rem}

.banner{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;padding:.7rem 1rem;border-radius:12px;background:var(--hema-soft);color:var(--ink);font-size:.88rem;margin-bottom:1.2rem;max-width:76rem}
.banner b{color:var(--hema)}
.banner .row-btns{margin-left:auto}

.empty-state{max-width:36rem;padding:3rem 0}
.empty-state p{color:var(--ink2);font-size:1.02rem}

.dock{display:none}

@media (max-width:1180px){
  .today{grid-template-columns:minmax(0,1fr)}
  .today .side{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.5rem}
  .note,.journal{grid-template-columns:minmax(0,1fr)}
  .side-panel{position:static;max-height:none;overflow:visible}
}
@media (max-width:820px){
  body{font-size:14.5px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .topbar .m-brand{display:flex}
  .topbar .m-brand b{display:none}
  .search-trigger kbd,.topbar .hide-m{display:none}
  .main{padding:.6rem max(16px,env(safe-area-inset-right,0px)) 6.5rem max(16px,env(safe-area-inset-left,0px))}
  .dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .dock a{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem 0 .55rem;text-decoration:none;font-size:.68rem;font-weight:500;color:var(--ink3)}
  .dock a svg.i{width:1.3rem;height:1.3rem}
  .dock a.on{color:var(--hema)}
  .toast{bottom:calc(5.4rem + env(safe-area-inset-bottom,0px))}
  .synapse{grid-template-columns:minmax(0,1fr)}
  .syn-mid{flex-direction:row;flex-wrap:wrap;justify-content:center;padding:1.1rem 0}
  .board{grid-template-columns:repeat(3,minmax(15rem,85vw))}
  .bcard .mv{opacity:1}
  .gwrap{height:calc(100dvh - 12rem)}
  .gpanel{left:.8rem;right:.8rem;width:auto;max-height:45%}
  .ghint{display:none}
  .gctl .field{flex:1 1 100%}
  .gtog{font-size:.74rem;padding:.35rem .5rem}
  .sec-h .eyebrow{display:none}
  .row .m{grid-column:2/4}
  .row{grid-template-columns:1rem minmax(0,1fr)}
  .crumbs{margin-bottom:1rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
.m-only{display:none!important}
@media (max-width:820px){.m-only{display:inline-flex!important}}

</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Sidebar">
    <a class="brand" href="#/today"><b>Commonplace</b></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div id="rail-pinned"></div>
    <div id="rail-tags"></div>
    <div class="grow"></div>
    <div class="foot">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="row-btns">
        <button class="btn ghost sm" data-act="tools">Import and backup</button>
        <button class="ib" data-act="theme" title="Switch theme" aria-label="Switch theme"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
        <button class="ib" data-act="keys" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg></button>
      </div>
    </div>

  else{const old=ix.vec[i];if(old)for(const t of old.keys()){const p=ix.post.get(t);if(p){const k=p.indexOf(i);if(k>=0)p.splice(k,1);}}}
  const tf=new Map();for(const t of tokenize(noteText(n)))tf.set(t,(tf.get(t)||0)+1);
  const v=weigh(tf,ix.idf,ix.N);ix.vec[i]=v;
  for(const t of v.keys()){if(!ix.idf.has(t))ix.idf.set(t,Math.log(ix.N+1));let p=ix.post.get(t);if(!p){p=[];ix.post.set(t,p);}if(!p.includes(i))p.push(i);}
  S.tagSets[i]=tagsOf(n);S.tagIdx=makeTagIdx(S.tagSets);rebuildTitles();S.lc.delete(id);
  for(const [k,e] of [...S.edges]){if(e.a===id||e.b===id)S.edges.delete(k);}
  addSysEdges(ix,S.tagSets,S.tagIdx,i,S.edges);
  rebuildUserEdges();rebuildAdj();
}
/* retrieval for "Ask your notes": score every note against the question's terms */
function retrieve(q,k){
  const terms=tokenize(q);if(!terms.length||!S.ix)return [];
  const ix=S.ix;const out=[];
  ix.vec.forEach((v,i)=>{
    const n=S.notes.get(ix.ids[i]);if(!n||!v)return;let s=0;
    for(const t of terms){const w=v.get(t);if(w)s+=w*(ix.idf.get(t)||1);}
    const tl=(n.title||"").toLowerCase();for(const t of terms)if(tl.includes(t))s+=.4;
    if(s>0)out.push([n,s]);
  });
  out.sort((a,b)=>b[1]-a[1]);return out.slice(0,k||8).map(x=>x[0]);
}

function daySeed(){return Math.floor(Date.now()/DAY);}
function pickPool(pool,count,keyFn){const d=daySeed();return pool.map(x=>[hash(keyFn(x)+d),x]).sort((a,b)=>a[0]<b[0]?-1:1).slice(0,count).map(x=>x[1]);}
function insightPool(){
  const arr=[];
  for(const e of S.edges.values()){
    if(e.kind!=="sys")continue;const a=S.notes.get(e.a),b=S.notes.get(e.b);if(!a||!b)continue;
    if(S.dismissed.has(edgeKey(e.a,e.b)))continue;
    if(a.src==="chat"&&b.src==="chat")continue;
    if((S.links.get(e.a)||new Set()).has(e.b)||(S.links.get(e.b)||new Set()).has(e.a))continue;
    arr.push(e);
  }
  arr.sort((x,y)=>y.s-x.s);
  return pickPool(arr.slice(0,12),12,e=>e.a+e.b);
}
function forgotten(count){
  const now=Date.now();const recent=new Set();
  for(const n of S.notes.values())if(now-touched(n)<30*DAY)recent.add(n.id);
  let pool=[];
  for(const n of S.notes.values()){
    if(n.daily)continue;const age=(now-touched(n))/DAY;if(age<120)continue;
    const adj=S.adj.get(n.id)||[];if(!adj.length)continue;
    pool.push({n,age,rc:adj.filter(a=>recent.has(a.o)).length,deg:adj.length});
  }
  const nonChat=pool.filter(p=>p.n.src!=="chat");if(nonChat.length>=count)pool=nonChat;
  pool.sort((a,b)=>(b.rc-a.rc)||(b.age-a.age));
  return pickPool(pool.slice(0,20),count,p=>p.n.id);
}
function snippetFor(n,src,len){
  const plain=plainText(n.body);if(!plain)return "";
  let idx=0;
  if(src){try{const m=new RegExp("(?<![\\p{L}\\d])(?:"+src+")(?![\\p{L}\\d])","iu").exec(plain);if(m)idx=m.index;}catch(e){}}
  const start=Math.max(0,idx-60);const end=Math.min(plain.length,start+(len||190));
  let t=plain.slice(start,end);if(start>0)t="… "+t;if(end<plain.length)t+=" …";
  return highlightHtml(esc(t),src);
}

const isKeep=o=>o&&typeof o==="object"&&!Array.isArray(o)&&("textContent" in o||"listContent" in o)&&("isTrashed" in o||"userEditedTimestampUsec" in o);
function keepToNote(o,fname){
  if(o.isTrashed)return null;
  let body=o.textContent||"";
  if(Array.isArray(o.listContent)&&o.listContent.length)body+=(body?"\n\n":"")+o.listContent.map(x=>`- [${x.isChecked?"x":" "}] ${x.text||""}`).join("\n");
  const title=(o.title||"").trim();if(!title&&!body.trim())return null;
  const c=Math.floor(Number(o.createdTimestampUsec)/1000)||Date.now(),u=Math.floor(Number(o.userEditedTimestampUsec)/1000)||c;
  return {id:"keep:"+(o.createdTimestampUsec||hash(fname||title+body)),title:title||firstLine(body).slice(0,70),body,
    tags:(o.labels||[]).map(l=>slug(l.name)).filter(Boolean),src:"keep",stage:"capture",created:c,updated:u,opened:0,inbox:false,pinned:!!o.isPinned,icon:"",meta:{archived:!!o.isArchived}};
}
function chatToNote(c){
  const parts=[];
  for(const m of (c.chat_messages||[])){
    let t=m.text;if(!t&&Array.isArray(m.content))t=m.content.filter(x=>x&&x.type==="text"&&x.text).map(x=>x.text).join("\n");
    if(!t||!String(t).trim())continue;parts.push((m.sender==="human"?"**You:** ":"**Claude:** ")+String(t).trim());
  }
  if(!parts.length)return null;
  let body=parts.join("\n\n");if(body.length>80000)body=body.slice(0,80000)+"\n\n… (cut for length)";
  const created=Date.parse(c.created_at)||Date.now(),updated=Date.parse(c.updated_at)||created;
  return {id:"chat:"+(c.uuid||hash(body)),title:(c.name||"").trim()||firstLine(parts[0].replace(/^\*\*You:\*\*\s*/,"")).slice(0,70)||"Untitled chat",body,tags:[],src:"chat",stage:"capture",created,updated,opened:0,inbox:false,pinned:false,icon:"",meta:{msgs:parts.length}};
}
function mdToNote(text,name,mod){
  let body=String(text).replace(/\r\n?/g,"\n");const tags=[];
  const fm=body.match(/^---\n([\s\S]*?)\n---\n?/);
  if(fm){body=body.slice(fm[0].length);const tl=fm[1].match(/^tags:\s*(.*)$/m);if(tl){tl[1].replace(/[\[\]]/g,"").split(/[,\s]+/).forEach(t=>{t=slug(t.replace(/^#/,""));if(t)tags.push(t);});}
    const tb=fm[1].match(/^tags:\s*\n((?:\s*-\s*.+\n?)+)/m);if(tb)tb[1].split("\n").forEach(l=>{const t=slug(l.replace(/^\s*-\s*/,"").replace(/^#/,""));if(t)tags.push(t);});}
  const base=name.split("/").pop().replace(/\.(md|markdown|txt)$/i,"");
  const h1=body.match(/^#\s+(.+)$/m);let title=base;
  if(h1&&base.length<2)title=h1[1].trim();
  return {id:"file:"+hash(name+":"+body.length),title,body:body.trim(),tags:[...new Set(tags)],src:"file",stage:"capture",created:mod||Date.now(),updated:mod||Date.now(),opened:0,inbox:false,pinned:false,icon:"",meta:{path:name}};
}
async function importFiles(fileList){
  const files=[...fileList];if(!files.length)return;
  const r={keep:0,chat:0,file:0,skipped:0,restored:0,unknown:0};const add=[];const seen=new Set();
  const push=(n,kind)=>{if(!n)return;if(S.notes.has(n.id)||seen.has(n.id)){r.skipped++;return;}seen.add(n.id);add.push(n);r[kind]++;};
  const handleJson=(obj,name)=>{
    if(Array.isArray(obj)){
      if(obj.length&&obj[0]&&Array.isArray(obj[0].chat_messages)){obj.forEach(c=>push(chatToNote(c),"chat"));}
      else if(obj.length&&isKeep(obj[0])){obj.forEach((o,i)=>push(keepToNote(o,name+i),"keep"));}
    }else if(obj&&obj.format==="commonplace-backup"&&Array.isArray(obj.notes)){
      obj.notes.forEach(n=>{if(!n||!n.id)return;if(S.notes.has(n.id)||seen.has(n.id)){r.skipped++;return;}seen.add(n.id);add.push(n);r.restored++;});
    }else if(isKeep(obj)){push(keepToNote(obj,name),"keep");}
  };
  toast("Reading files…",{ms:60000});
  for(const f of files){
    const nm=(f.webkitRelativePath||f.name);const low=nm.toLowerCase();
    try{
      if(low.endsWith(".zip")){
        if(!window.JSZip){toast("Zip support did not load. Unzip the file first, then choose the files inside.",{ms:7000});continue;}
        const z=await JSZip.loadAsync(f);const entries=Object.values(z.files).filter(e=>!e.dir);let k=0;
        for(const e of entries){const en=e.name.toLowerCase();
          if(en.endsWith(".json")){try{handleJson(JSON.parse(await e.async("string")),e.name);}catch(_){}}
          else if(/\.(md|markdown)$/.test(en)){push(mdToNote(await e.async("string"),e.name,f.lastModified),"file");}
          if(++k%80===0){toast(`Reading ${f.name}… ${k} of ${entries.length}`,{ms:60000});await tick();}}
      }else if(low.endsWith(".json")){handleJson(JSON.parse(await f.text()),nm);}
      else if(/\.(md|markdown|txt)$/.test(low)){if(/labels\.txt$/.test(low))continue;push(mdToNote(await f.text(),nm,f.lastModified),"file");}
      else r.unknown++;
    }catch(err){r.unknown++;}
  }
  if(add.length){await addNotes(add);toast("Finding connections…",{ms:60000});await indexAll();}
  const bits=[];if(r.keep)bits.push(`${r.keep} Keep notes`);if(r.chat)bits.push(`${r.chat} chats`);if(r.file)bits.push(`${r.file} files`);if(r.restored)bits.push(`${r.restored} notes restored`);
  let msg=bits.length?"Added "+bits.join(", ")+".":"No new notes found.";
  if(r.skipped)msg+=` ${r.skipped} already here.`;if(r.unknown&&!bits.length)msg+=" Choose a Keep or Claude export, or Markdown files.";
  toast(msg,{ms:6500});route();
}

async function saveFile(filename,data){
  try{
    const dl=window.claude&&claude.use?await claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});return true;}
  }catch(e){if(e&&e.code==="declined")return false;}
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;}
  catch(e){toast("This view cannot save files. Open the page in a normal browser tab to back up.");return false;}
}
function noteToMd(n){

  if(n.daily)fm.push(`date: ${n.daily}`);

function lcOf(n){let c=S.lc.get(n.id);if(!c){c={t:titleOf(n).toLowerCase(),b:(n.body||"").toLowerCase(),g:[...tagsOf(n)].join(" ")};S.lc.set(n.id,c);}return c;}
function filtered(){
  const f=S.filter;let list=[...S.notes.values()];
  if(f.src!=="all")list=list.filter(n=>srcKey(n)===f.src);
  if(f.tag)list=list.filter(n=>tagsOf(n).has(f.tag));
  const ws=f.q.toLowerCase().split(/\s+/).filter(Boolean);let snipSrc="";
  if(ws.length){
    const scored=[];
    for(const n of list){const c=lcOf(n);let sc=0,ok=true;
      for(const w of ws){let s=0;if(c.t.includes(w))s+=5;if(c.g.includes(w))s+=3;if(c.b.includes(w))s+=1;if(!s){ok=false;break;}sc+=s;}
      if(ok)scored.push([n,sc]);}
    scored.sort((a,b)=>(b[1]-a[1])||(touched(b[0])-touched(a[0])));
    list=scored.map(x=>x[0]);snipSrc=ws.map(reEsc).join("|");
  }else{
    const deg=n=>(S.adj.get(n.id)||[]).length;
    if(f.sort==="oldest")list.sort((a,b)=>touched(a)-touched(b));
    else if(f.sort==="linked")list.sort((a,b)=>deg(b)-deg(a));
    else if(f.sort==="az")list.sort((a,b)=>titleOf(a).localeCompare(titleOf(b)));
    else list.sort((a,b)=>touched(b)-touched(a));
  }
  return {list,snipSrc};
}
function renderResults(){
  const el=$("#results");if(!el)return;const f=S.filter;const {list,snipSrc}=filtered();
  if(!list.length){el.innerHTML=`<p class="muted">Nothing matches. Try fewer words, or clear the filters.</p>`;return;}
  if(S.view==="board"){renderBoard(el,list.filter(n=>!n.daily));return;}
  const show=list.slice(0,f.shown);
  let h=`<p class="count">${list.length.toLocaleString()} ${list.length===1?"note":"notes"}</p>`;
  if(f.mode==="grid")h+=`<div class="grid">${show.map(gcardHtml).join("")}</div>`;
  else h+=`<ul class="rows">`+show.map(n=>`<li>${rowHtml(n,snipSrc?snippetFor(n,snipSrc,200):undefined)}</li>`).join("")+`</ul>`;
  if(list.length>show.length)h+=`<p style="margin-top:1rem"><button class="btn ghost sm" data-act="more">Show ${Math.min(150,list.length-show.length)} more</button></p>`;
  el.innerHTML=h;
}
function gcardHtml(n){

    ${show.map(n=>`<div class="card bcard" draggable="true" data-id="${esc(n.id)}" data-act="open" tabindex="0" role="link" aria-label="${esc(titleOf(n))}"><h4>${iconOf(n)}${esc(titleOf(n))}</h4><p>${esc(plainText(n.body).slice(0,140))}</p>

function connItem(n,oid,kind){
  const o=S.notes.get(oid);if(!o)return "";
  let why="",hl="",meter="",ctxLine="";
  if(kind==="back"){
    const re=new RegExp("\\[\\[\\s*"+reEsc(n.title||"")+"\\s*(\\|[^\\]]*)?\\]\\]","i");
    const line=String(o.body||"").split("\n").find(l=>re.test(l));
    if(line)ctxLine=`<span class="ctx">${inlineMd(line.replace(/^\s*([-*+]|\d+[.)])\s+(\[[ xX]\]\s+)?/,"").slice(0,220),ctx(o.id,true))}</span>`;
    else why="Links to this note.";
  }else if(kind==="out")why="You linked it from this note.";
  else{const ex=explain(S.ix,S.tagSets,n.id,oid);why=reasonText(ex);hl=hlSrc(ex.terms);meter=`<span class="meter" title="Strength ${ex.pct}%"><i style="width:${Math.min(100,ex.pct*2)}%"></i></span>`;}
  return `<li><a class="ct" href="#/note/${enc(oid)}" data-act="peek" data-hl="${esc(hl)}"><span class="dot" data-src="${srcKey(o)}"></span>${o.icon?esc(o.icon)+" ":""}${esc(titleOf(o))}${meter}</a>${why?`<span class="why">${esc(why)}</span>`:""}${ctxLine}${hl?`<span class="acts"><button class="lk" data-act="why" data-hl="${esc(hl)}">Show shared words</button><button class="lk" data-act="linkpair" data-a="${esc(n.id)}" data-b="${esc(oid)}">Link</button></span>`:""}</li>`;
}
function unlinkedMentions(n){
  const t=(n.title||"").trim();if(n.daily||t.length<4)return [];
  let re;try{re=new RegExp("(?<![\\p{L}\\d\\[])"+reEsc(t)+"(?![\\p{L}\\d])","iu");}catch(e){return [];}
  const out=[];
  for(const o of S.notes.values()){
    if(o.id===n.id||(S.links.get(o.id)||new Set()).has(n.id))continue;
    const b=String(o.body||"");const m=re.exec(b);if(!m)continue;
    const s=Math.max(0,m.index-60),e=Math.min(b.length,m.index+t.length+80);
    out.push({o,snip:(s>0?"… ":"")+esc(b.slice(s,m.index))+`<mark class="hl">${esc(m[0])}</mark>`+esc(b.slice(m.index+m[0].length,e))+(e<b.length?" …":"")});
    if(out.length>=8)break;
  }
  return out;
}
function renderSide(id){
  const el=$("#side");const n=S.notes.get(id);if(!el||!n)return;

  const found=(S.adj.get(id)||[]).filter(a=>a.k==="sys").sort((a,b)=>b.s-a.s);
  const heads=headingsOf(n.body);const um=unlinkedMentions(n);

  if(heads.length>1)h+=`<section><h2>Outline</h2><div class="outline">${heads.slice(0,24).map((x,i)=>`<a href="#" data-act="goto" data-h="${i}" data-l="${Math.min(3,x.lv)}">${esc(x.text)}</a>`).join("")}</div></section>`;
  if(backs.length)h+=`<section><h2>Linked mentions <span class="n">${backs.length}</span></h2><ul class="conn">${backs.map(o=>connItem(n,o,"back")).join("")}</ul></section>`;
  if(found.length)h+=`<section><h2>Found in your notes <span class="n">${found.length}</span></h2><ul class="conn">${found.slice(0,8).map(a=>connItem(n,a.o,"sys")).join("")}</ul></section>`;
  if(outs.length)h+=`<section><h2>You linked <span class="n">${outs.length}</span></h2><ul class="conn">${outs.map(o=>connItem(n,o,"out")).join("")}</ul></section>`;

  if(!backs.length&&!found.length&&!outs.length)h+=`<section><h2>Connections</h2><p class="muted" style="font-size:.86rem;margin:0">Nothing connected yet. Connections appear when another note shares tags or distinctive words, or when you link with [[double brackets]].</p></section>`;
  el.innerHTML=h;LG.draw(id);
}

/* ================= local graph (2D) ================= */
const LG={nodes:[],id:null,hover:null,
  draw(id){
    const cv=$("#lg");if(!cv)return;this.id=id;
    const adj=(S.adj.get(id)||[]).slice().sort((a,b)=>(b.k==="user")-(a.k==="user")||b.s-a.s).slice(0,12);
    const nodes=new Map();const seed=(nid,k)=>(parseInt(hash(nid+k).slice(0,5),36)%600)/10-30;const add=(nid,depth)=>{if(!nodes.has(nid)&&S.notes.has(nid))nodes.set(nid,{id:nid,depth,x:seed(nid,"x"),y:seed(nid,"y"),vx:0,vy:0});};
    add(id,0);adj.forEach(a=>add(a.o,1));
    for(const a of adj){if(nodes.size>=26)break;(S.adj.get(a.o)||[]).slice().sort((x,y)=>y.s-x.s).slice(0,2).forEach(b=>{if(nodes.size<26)add(b.o,2);});}
    const edges=[];for(const e of S.edges.values()){if(nodes.has(e.a)&&nodes.has(e.b))edges.push({a:nodes.get(e.a),b:nodes.get(e.b),k:e.kind});}
    const N=[...nodes.values()];const c0=nodes.get(id);c0.x=0;c0.y=0;
    for(let it=0;it<220;it++){
      for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const p=N[i],q=N[j];let dx=p.x-q.x,dy=p.y-q.y;let d2=dx*dx+dy*dy||1;const f=1600/d2;p.vx+=dx*f*.02;p.vy+=dy*f*.02;q.vx-=dx*f*.02;q.vy-=dy*f*.02;}
      for(const e of edges){const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y;const d=Math.hypot(dx,dy)||1;const l=(d-(e.a.depth+e.b.depth>2?34:48))/d*.06;e.a.vx+=dx*l;e.a.vy+=dy*l;e.b.vx-=dx*l;e.b.vy-=dy*l;}
      for(const p of N){if(p===c0)continue;p.vx-=p.x*.004;p.vy-=p.y*.004;p.vx*=.7;p.vy*=.7;p.x+=p.vx;p.y+=p.vy;}
    }
    this.nodes=N;this.edges=edges;this.paint();
    if(!cv.dataset.bound){cv.dataset.bound="1";
      cv.addEventListener("mousemove",e=>{const p=this.at(e);const hid=p?p.id:null;if(hid!==this.hover){this.hover=hid;cv.style.cursor=hid?"pointer":"default";this.paint();}});
      cv.addEventListener("mouseleave",()=>{this.hover=null;this.paint();});
      cv.addEventListener("click",e=>{const p=this.at(e);if(p&&p.id!==this.id)location.hash="#/note/"+enc(p.id);});}
  },

function edClose(){Ed.mode=null;const p=$("#edpop");if(p)p.remove();}
function edApply(ta){
  const it=Ed.items[Ed.idx];if(!it||!ta)return edClose();const pos=ta.selectionStart;const mode=Ed.mode;edClose();
  if(mode==="wiki"){
    const after=ta.value.slice(pos,pos+2);insertText(ta,it.ins+(after==="]]"?"":"]]"),Ed.start,pos);
    if(after==="]]")ta.setSelectionRange(ta.selectionStart+2,ta.selectionStart+2);
  }else if(it.tpl){
    insertText(ta,fillTpl(it.tpl.body),Ed.start,pos);
    const n=S.notes.get(S.curId);if(n){n.tags=[...new Set([...(n.tags||[]),...it.tpl.tags])];queueSave(n);const tr=$("#tagrow");if(tr)tr.innerHTML=tagRowHtml(n);}
  }else{
    const t=typeof it.t==="function"?it.t():it.t;insertText(ta,t+(it.after||""),Ed.start,pos);
    if(it.after){const c=ta.selectionStart-it.after.length;ta.setSelectionRange(c,c);}
    if(t==="[[")edUpdate(ta);
  }

}
function edKeydown(e,ta){
  if(Ed.mode){
    if(e.key==="ArrowDown"){e.preventDefault();Ed.idx=(Ed.idx+1)%Ed.items.length;edPaint(ta);return true;}
    if(e.key==="ArrowUp"){e.preventDefault();Ed.idx=(Ed.idx-1+Ed.items.length)%Ed.items.length;edPaint(ta);return true;}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();edApply(ta);return true;}
    if(e.key==="Escape"){e.preventDefault();edClose();return true;}
  }
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&(e.key==="b"||e.key==="i")){e.preventDefault();const w=e.key==="b"?"**":"*";const s=ta.selectionStart,en=ta.selectionEnd;const sel=ta.value.slice(s,en);insertText(ta,w+sel+w,s,en);if(!sel)ta.setSelectionRange(s+w.length,s+w.length);else ta.setSelectionRange(s+w.length,en+w.length);return true;}
  if(e.key==="Escape"||(mod&&e.key==="Enter")){e.preventDefault();finishEdit();return true;}
  if(e.key==="Enter"&&!e.shiftKey&&!mod&&ta.selectionStart===ta.selectionEnd){
    const pos=ta.selectionStart;const ls=ta.value.lastIndexOf("\n",pos-1)+1;const line=ta.value.slice(ls,pos);
    const m=line.match(/^(\s*)([-*+]|(\d+)([.)]))\s+(\[[ xX]\]\s+)?/);
    if(m){e.preventDefault();
      if(line.slice(m[0].length).trim()===""){insertText(ta,"",ls,pos);return true;}
      const bullet=m[3]?(+m[3]+1)+m[4]:m[2];insertText(ta,"\n"+m[1]+bullet+" "+(m[5]?"[ ] ":""));autosize(ta);return true;}
  }
  return false;
}

/* ================= ask your notes (Claude) ================= */
let askCtl=null;
function openAsk(q){
  const d=$("#dlg");
  d.innerHTML=`<div class="sheet" style="width:min(46rem,calc(100vw - 2rem))"><button class="ib x" data-act="closedlg" aria-label="Close">${ic("x")}</button><h2>Ask your notes</h2>
  <p>Claude reads the notes that best match your question and answers with links back to them. Only those excerpts are sent with the question.</p>
  <form class="ask-q" data-form="ask"><label class="field">${ic("ask")}<input id="askq" placeholder="What have I written about…" autocomplete="off" aria-label="Your question"></label><button class="btn accent" type="submit" id="askgo">Ask</button></form><div id="askout"></div></div>`;
  if(!d.open)d.showModal();const i=$("#askq");i.value=q||"";i.focus();if(q)runAsk(q);
}
const ASK_ERR={not_granted:"Asking Claude was not allowed in this view.",rate_limited:"Too many questions at once. Wait a moment, then ask again.",prompt_too_large:"Those notes are too long to send at once. Ask something more specific.",sampling_disabled:"Asking Claude is turned off for this account.",session_expired:"Your session expired. Reload the page and ask again."};
async function runAsk(q){
  const out=$("#askout");if(!out||!S.sample)return;
  const notes=retrieve(q,8);
  if(!notes.length){out.innerHTML=`<p class="muted">None of your notes mention those words. Try different words, or capture a note about it first.</p>`;return;}
  let budget=18000;const parts=[];
  for(const n of notes){const t=String(n.body||"").slice(0,Math.min(2600,budget));budget-=t.length;parts.push(`=== [[${n.title||titleOf(n)}]] (${SRC[srcKey(n)]}, edited ${fmtDate(n.updated)})\n${t}`);if(budget<400)break;}
  const prompt=`You are helping someone think with their personal notes. Answer the question using only the notes below. Be concise: a short paragraph or a few bullets, in plain Markdown. When you use a note, cite it inline with its exact title in double square brackets, like [[Title]]. If the notes do not answer the question, say so in one sentence and suggest what they could write down.\n\nQuestion: ${q}\n\nNotes:\n${parts.join("\n\n")}`;
  askCtl&&askCtl.abort();askCtl=new AbortController();
  out.innerHTML=`<div class="answer" id="ans"><span class="thinking"><i></i><i></i><i></i> Reading ${notes.length} notes</span></div><div class="row-btns" style="margin-top:1rem" id="askacts"><button class="btn ghost sm" data-act="askstop">${ic("stop")}Stop</button></div>`;
  const srcHtml=`<div class="srcs"><span class="eyebrow" style="align-self:center">Read</span>${notes.map(n=>`<a class="chip" href="#/note/${enc(n.id)}" data-act="closedlg"><span class="dot" data-src="${srcKey(n)}"></span>${esc(titleOf(n).slice(0,40))}</a>`).join("")}</div>`;
  try{
    const res=await S.sample(prompt,{signal:askCtl.signal,onText:({text})=>{const a=$("#ans");if(a)a.innerHTML=`<div class="reader">${mdToHtml(text,ctx())}</div>`;}});
    const a=$("#ans");if(a)a.innerHTML=`<div class="reader">${mdToHtml(res.text,ctx())}</div>`;
    const acts=$("#askacts");if(acts){acts.innerHTML=`<button class="btn soft sm" data-act="asksave">${ic("plus")}Save as note</button>`;acts.insertAdjacentHTML("afterend",srcHtml);}
    S.lastAsk={q,a:res.text,notes:notes.map(n=>n.title).filter(Boolean)};
  }catch(e){
    const a=$("#ans");const acts=$("#askacts");if(acts)acts.innerHTML="";
    if(a){if(e&&e.text)a.innerHTML=`<div class="reader">${mdToHtml(e.text,ctx())}</div>`;else a.innerHTML="";
      if(!e||e.code!=="cancelled")a.insertAdjacentHTML("beforeend",`<p class="muted">${esc(ASK_ERR[e&&e.code]||"Claude could not answer just now. Try again in a moment.")}</p>`);}
  }
}

let curRoute="";
function route(){
  const h=decodeURIComponent((location.hash||"#/today").slice(1));const parts=h.split("/").filter(Boolean);const name=parts[0]||"today";
  Brain.stop();hidePreview();edClose();closeMenu();
  if(!S.ready)return;
  if(name==="new"){const title=parts.slice(1).join("/");createNote({title,stage:"capture"}).then(n=>{S.edit=true;location.replace("#/note/"+enc(n.id));});return;}
  if(name!=="note"&&document.body.classList.contains("focus"))document.body.classList.remove("focus");
  const prevView=S.view;
  if(name==="notes"&&parts[1]==="tag"){S.filter.tag=parts.slice(2).join("/").toLowerCase();S.filter.src="all";S.filter.q="";S.filter.shown=150;}
  else if((name==="notes"||name==="board")&&!["notes","board","note"].includes(prevView))S.filter.tag="";
  const m=$("#main");S.view=name;
  if(name==="note"){
    const id=parts.slice(1).join("/");
    if(S.curId!==id||prevView!=="note"){if(S.curId!==id)S.edit=S.edit&&S.curId===null;S.hl=S.keepHl||"";S.keepHl="";}else if(S.keepHl){S.hl=S.keepHl;S.keepHl="";}
    S.curId=id;const n=S.notes.get(id);if(n){n.opened=Date.now();queueSave(n);}
    if(n&&!String(n.body||"").trim()&&!n.daily)S.edit=true;
    setNav(n&&n.daily?"journal":"notes");m.innerHTML=viewNote(id);
    const t=$("#title");if(t){autosize(t);if(S.edit&&!t.value)t.focus();}
    renderSide(id);const ed=$("#editor");if(ed){autosize(ed);if(!t||t.value)ed.focus();}
    if(S.hl){const mk=$("#body mark.hl");mk&&setTimeout(()=>mk.scrollIntoView({block:"center",behavior:"smooth"}),60);}
  }else if(name==="notes"||name==="board"){S.view=name;setNav(name);S.edit=false;m.innerHTML=viewNotes(name==="board");renderResults();}
  else if(name==="graph"){setNav("graph");m.innerHTML=viewGraph();Brain.init();}
  else if(name==="tasks"){setNav("tasks");m.innerHTML=viewTasks();}
  else if(name==="journal"){
    const k=parts[1]&&/^\d{4}-\d{2}-\d{2}$/.test(parts[1])?parts[1]:dkey(new Date());
    if(S.jdate!==k){S.edit=false;const d=parseKey(k);S.cal={y:d.getFullYear(),m:d.getMonth()};}
    S.jdate=k;setNav("journal");m.innerHTML=viewJournal();const ed=$("#editor");if(ed)autosize(ed);
  }
  else{S.view="today";setNav("today");m.innerHTML=viewToday();autosize($("#cap"));requestAnimationFrame(drawSynapse);document.fonts&&document.fonts.ready.then(drawSynapse);}
  renderRail();
  if(curRoute!==h)window.scrollTo(0,0);curRoute=h;paintStatus();
}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  if(!e.target.closest("#menu")&&!e.target.closest('[data-act="notemenu"],[data-act="icon"]'))closeMenu();
  const dlg=e.target.closest("dialog");if(dlg&&e.target===dlg){dlg.close();return;}
  const pi=e.target.closest("[data-pi]");if(pi){Pal.run(+pi.dataset.pi);return;}
  const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act;
  switch(act){
    case "palette":Pal.open("");break;
    case "ask":openAsk("");break;
    case "new":newNote();break;
    case "peek":S.keepHl=el.dataset.hl||"";break;
    case "open":if(!e.target.closest("button"))location.hash="#/note/"+enc(el.dataset.id);break;
    case "tick":{e.preventDefault();e.stopPropagation();const nid=el.dataset.nid||S.curId;tickTask(nid,el.dataset.ln);const on=!el.classList.contains("on");el.classList.toggle("on",on);el.setAttribute("aria-pressed",on);const row=el.closest(".task,li.chk");if(row)row.classList.toggle("done",on);paintStatus();break;}
    case "startedit":{if(e.target.closest("a,button,.cb")||String(getSelection())!=="")break;startEdit();break;}
    case "edit":S.edit?finishEdit():startEdit();break;
    case "why":{S.hl=el.dataset.hl;const n=S.notes.get(S.curId);if(S.edit)finishEdit();$("#body").innerHTML=bodyHtml(n);$("#docfoot").innerHTML=footHtml();
      const mk=$("#body mark.hl");if(mk)mk.scrollIntoView({block:"center",behavior:"smooth"});else toast("Those words are in the other note, not this one.");break;}
    case "clearhl":{S.hl="";const n=S.notes.get(S.curId);$("#body").innerHTML=bodyHtml(n);$("#docfoot").innerHTML=footHtml();break;}
    case "sorted":{const n=S.notes.get(el.dataset.id||S.curId);if(!n)break;n.inbox=false;queueSave(n);toast("Marked as sorted.");if(S.view==="today")route();else el.remove();break;}
    case "rmtag":{const n=S.notes.get(S.curId);n.tags=(n.tags||[]).filter(t=>String(t).toLowerCase()!==el.dataset.t);n.updated=Date.now();queueSave(n);queueReindex(n.id);$("#tagrow").innerHTML=tagRowHtml(n);break;}
    case "stage":{setStage(S.curId,el.dataset.v);$$(".stage button").forEach(b=>{const on=b.dataset.v===el.dataset.v;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});break;}
    case "stagemv":{e.stopPropagation();setStage(el.dataset.id,el.dataset.v);renderResults();break;}
    case "pin":togglePin();break;
    case "focus":toggleFocus();break;
    case "icon":{openMenu(el,`<div class="ph">Icon</div><div class="emoji-grid">${EMOJI.map(x=>`<button data-m="${x}" aria-label="${x}">${x}</button>`).join("")}</div>${S.notes.get(S.curId).icon?`<button data-m="" style="margin-top:.3rem">${ic("x")}Remove icon</button>`:""}`,v=>{const n=S.notes.get(S.curId);n.icon=v;queueSave(n);route();});break;}
    case "notemenu":{const n=S.notes.get(S.curId);openMenu(el,`<button data-m="copy">${ic("copy")}Copy as Markdown</button><button data-m="export">${ic("download")}Export as .md file</button><button data-m="random">${ic("shuffle")}Open a random note</button><button data-m="delete" style="color:var(--danger)">${ic("trash")}Delete note</button>`,async m=>{
      if(m==="copy"){try{await navigator.clipboard.writeText(noteToMd(n));toast("Copied as Markdown.");}catch(_){toast("Copying is blocked here. Use Export as .md file instead.");}}
      else if(m==="export"){if(await saveFile((slug(titleOf(n)).slice(0,60)||"note")+".md",noteToMd(n)))toast("Exported.");}
      else if(m==="random")randomNote();else if(m==="delete")deleteNote(n.id);});break;}
    case "goto":{e.preventDefault();if(S.edit)finishEdit();const t=$("#h-"+el.dataset.h);t&&t.scrollIntoView({block:"start",behavior:"smooth"});break;}
    case "linkpair":{if(linkPair(el.dataset.a,el.dataset.b)){if(S.view==="note"){const n=S.notes.get(S.curId);if(!S.edit)$("#body").innerHTML=bodyHtml(n);renderSide(S.curId);}else route();}break;}
    case "dismisspair":{S.dismissed.add(edgeKey(el.dataset.a,el.dataset.b));DB.setMeta("dismissed",[...S.dismissed]);toast("Got it. That pair will not come up again.");route();break;}
    case "nextpair":S.insIdx++;route();break;
    case "linkmention":{const o=S.notes.get(el.dataset.id),n=S.notes.get(S.curId);if(!o||!n)break;
      const re=new RegExp("(?<![\\p{L}\\d\\[])"+reEsc(n.title.trim())+"(?![\\p{L}\\d])","iu");o.body=String(o.body).replace(re,m=>m.toLowerCase()===n.title.trim().toLowerCase()&&m!==n.title.trim()?`[[${n.title.trim()}|${m}]]`:`[[${m}]]`);
      o.updated=Date.now();queueSave(o);rebuildTitles();rebuildUserEdges();rebuildAdj();renderSide(n.id);toast(`Linked from “${titleOf(o).slice(0,40)}”.`);break;}
    case "src":S.filter.src=el.dataset.v;S.filter.shown=150;route();break;
    case "mode":{const v=el.dataset.v;if(v==="board"){location.hash="#/board";}else{S.filter.mode=v;LS.set("mode",v);if(S.view==="board")location.hash="#/notes";else route();}break;}
    case "more":S.filter.shown+=150;renderResults();break;
    case "tshow":S.tasks.show=el.dataset.v;route();break;
    case "jday":location.hash="#/journal/"+el.dataset.k;break;
    case "calnav":{let {y,m}=S.cal;m+=+el.dataset.d;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.cal={y,m};const c=$(".cal");if(c)c.outerHTML=calHtml(S.jdate);break;}
    case "cap-journal":{const t=$("#cap");if(!t.value.trim()){t.focus();break;}capture(t.value,true).then(()=>{toast("Added to today’s journal.");route();});break;}
    case "tools":openTools();break;
    case "keys":openKeys();break;
    case "theme":{const order=["system","dark","light"];const cur=LS.get("theme","system");setTheme(order[(order.indexOf(cur)+1)%3]);break;}
    case "settheme":{setTheme(el.dataset.v);$$('[data-act="settheme"]').forEach(b=>b.classList.toggle("on",b===el));break;}
    case "closedlg":{askCtl&&askCtl.abort();const d=el.closest("dialog");if(d)d.close();break;}
    case "askstop":askCtl&&askCtl.abort();break;
    case "asksave":{const a=S.lastAsk;if(!a)break;$("#dlg").close();const n=await createNote({title:a.q.slice(0,80),body:a.a+"\n\n---\nAnswered from: "+a.notes.map(t=>`[[${t}]]`).join(", "),tags:["asked"]});location.hash="#/note/"+enc(n.id);break;}
    case "sample":{if($("#dlg").open)$("#dlg").close();addSamples();break;}
    case "rmsample":{if(await confirmBox("Remove sample notes?","Your own notes stay. Only the sample notes go.","Remove samples"))removeSamples();break;}
    case "clearall":{$("#dlg").close();if(!await confirmBox("Delete every note?","This removes every note from this browser and cannot be undone. Make a backup first.","Delete everything",true))break;await DB.clear();S.notes=new Map();await indexAll();location.hash="#/today";route();break;}
    case "rebuild":{$("#dlg").close();await indexAll();toast("Connections rebuilt.");route();break;}
    case "expmd":exportMarkdown();break;
    case "expjson":exportBackup();break;
    case "bsel":Brain.select(el.dataset.id);break;
    case "bclear":Brain.select(null);break;
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  if(f==="capture"){const t=$("#cap");const v=t.value;if(!v.trim())return;capture(v).then(()=>{toast("Saved to your inbox.");route();});}
  else if(f==="task"){const i=$("#newtask");const v=i.value.trim();if(!v)return;const n=ensureDaily(dkey(new Date()));n.body=(n.body||"").replace(/\s+$/,"")+((n.body||"").trim()?"\n":"")+"- [ ] "+v;n.updated=Date.now();queueSave(n);reindexNote(n.id);toast("Added to today’s journal.");route();setTimeout(()=>{const x=$("#newtask");x&&x.focus();},30);}
  else if(f==="ask"){const q=$("#askq").value.trim();if(q)runAsk(q);}
});
document.addEventListener("keydown",e=>{
  const t=e.target;const mod=e.metaKey||e.ctrlKey;
  if(t.id==="editor"&&edKeydown(e,t))return;
  if(t.id==="palq"){Pal.key(e);return;}
  if($("#menu")&&e.key==="Escape"){closeMenu();return;}
  if(t.id==="cap"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(mod)$('[data-act="cap-journal"]').click();else $('[data-form="capture"]').requestSubmit();return;}
  if(t.id==="title"&&e.key==="Enter"){e.preventDefault();startEdit();return;}
  if(t.classList&&t.classList.contains("bcard")&&e.key==="Enter"){location.hash="#/note/"+enc(t.dataset.id);return;}
  if(t.id==="addtag"&&(e.key==="Enter"||e.key===",")){e.preventDefault();const v=slug(t.value.replace(/^#/,""));if(!v)return;const n=S.notes.get(S.curId);n.tags=[...new Set([...(n.tags||[]),v])];n.updated=Date.now();queueSave(n);queueReindex(n.id);$("#tagrow").innerHTML=tagRowHtml(n);const ni=$("#addtag");ni&&ni.focus();return;}
  if(mod&&e.key.toLowerCase()==="k"){e.preventDefault();if($("#palette").open)$("#palette").close();else Pal.open("");return;}
  if(document.querySelector("dialog[open]")||isTyping(t)||mod||e.altKey)return;
  const k=e.key;
  if(k==="/"){e.preventDefault();Pal.open("");}
  else if(k==="n"){e.preventDefault();newNote();}
  else if(k==="j")location.hash="#/journal";
  else if(k==="t")location.hash="#/today";
  else if(k==="g")location.hash="#/graph";
  else if(k==="b")location.hash="#/board";
  else if(k==="r")randomNote();
  else if(k==="?")openKeys();
  else if(k==="e"&&(S.view==="note"||S.view==="journal")&&!S.edit){e.preventDefault();startEdit();}
  else if(k==="f"&&S.view==="note")toggleFocus();
  else if(k==="Escape"&&document.body.classList.contains("focus"))toggleFocus();
});
let qTimer=0;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){clearTimeout(qTimer);qTimer=setTimeout(()=>{S.filter.q=t.value;S.filter.shown=150;renderResults();},140);}
  else if(t.id==="palq"){Pal.idx=0;Pal.render();}
  else if(t.id==="gq"){S.brain.q=t.value;Brain.search(t.value);}
  else if(t.id==="cap")autosize(t);
  else if(t.id==="title"){autosize(t);const n=S.notes.get(S.curId);if(!n)return;n.title=t.value.replace(/\n/g," ");n.updated=Date.now();queueSave(n);queueReindex(n.id);const ct=$(".crumbs .ct-t");if(ct)ct.textContent=titleOf(n);}
  else if(t.id==="editor"){
    autosize(t);let n=S.notes.get(S.curId);
    if(!n&&S.view==="journal"){n=ensureDaily(S.jdate||dkey(new Date()));S.curId=n.id;}
    if(!n)return;n.body=t.value;n.updated=Date.now();queueSave(n);queueReindex(n.id);edUpdate(t);
  }
});
document.addEventListener("selectionchange",()=>{const a=document.activeElement;if(Ed.mode&&a&&a.id==="editor"){const p=a.selectionStart;if(p<Ed.start)edClose();}});
document.addEventListener("focusout",e=>{if(e.target.id==="editor")setTimeout(()=>{if(document.activeElement&&document.activeElement.id!=="editor")edClose();},120);});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.sel==="tag"){S.filter.tag=t.value;S.filter.shown=150;renderResults();}
  else if(t.dataset.sel==="sort"){S.filter.sort=t.value;renderResults();}
  else if(t.dataset.chk==="chats"){S.brain.chats=t.checked;route();}
  else if(t.dataset.chk==="glow"){S.brain.glow=t.checked;Brain.invalidate();}
  else if(t.id==="f-any"||t.id==="f-dir"){const fl=[...t.files];t.value="";$("#dlg").close();importFiles(fl);}
});
document.addEventListener("mouseover",e=>{
  const a=e.target.closest&&e.target.closest('a.wl[href^="#/note/"],.conn a.ct');if(!a||!matchMedia("(hover: hover)").matches)return;
  clearTimeout(pvTimer);pvTimer=setTimeout(()=>showPreview(a),380);
});
document.addEventListener("mouseout",e=>{const a=e.target.closest&&e.target.closest('a.wl,.conn a.ct');if(a&&!a.contains(e.relatedTarget))hidePreview();});
/* board drag and drop */
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".bcard");if(!c)return;c.classList.add("dragging");e.dataTransfer.setData("text/x-note",c.dataset.id);e.dataTransfer.effectAllowed="move";});
document.addEventListener("dragend",e=>{const c=e.target.closest&&e.target.closest(".bcard");if(c)c.classList.remove("dragging");$$(".col.over").forEach(x=>x.classList.remove("over"));});
document.addEventListener("dragover",e=>{
  const col=e.target.closest&&e.target.closest(".col");
  if(col&&[...e.dataTransfer.types].includes("text/x-note")){e.preventDefault();$$(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over");return;}
  if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault();
});
document.addEventListener("drop",e=>{
  const col=e.target.closest&&e.target.closest(".col");const id=e.dataTransfer.getData("text/x-note");
  if(col&&id){e.preventDefault();setStage(id,col.dataset.stage);renderResults();return;}
  if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();if($("#dlg").open)$("#dlg").close();importFiles(e.dataTransfer.files);}
});
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{drawSynapse();if(S.view==="note")LG.paint();});
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.view==="graph")Brain.invalidate();if(S.view==="note")LG.paint();});

/* ================= start ================= */
(async function start(){
  applyTheme(LS.get("theme","system"));renderShell();
  $("#main").innerHTML=`<p class="mono faint" style="padding:2rem 0">Opening your notes…</p>`;
  const ok=await DB.open();S.savedLocal=ok;
  try{
    const arr=await DB.all();arr.forEach(n=>S.notes.set(n.id,n));
    const dm=await DB.getMeta("dismissed");if(Array.isArray(dm))S.dismissed=new Set(dm);
    if(!arr.length&&!(await DB.getMeta("seeded"))){await DB.setMeta("seeded",1);await addNotes(sampleNotes());}
  }catch(e){}
  rebuildTitles();S.ready=true;route();
  if(S.notes.size)await indexAll();else{S.progress=null;S.ix={ids:[],pos:new Map(),vec:[],idf:new Map(),post:new Map(),N:0};}
  paintStatus();if(S.view!=="note"||!S.edit)route();
  try{if(window.claude&&claude.use){const s=await claude.use("sample");if(s){S.sample=s;$("#askBtn").classList.remove("hide");}}}catch(e){}
})();

</script>
